# ═══════════════════════════════════════════════════════════════
# OpenVibe.Homes — https://openvibe.homes, served by OpenVibe.Rent's process (127.0.0.1:5010; server/homes, chosen by
# the Host header). Uses the rate zones openvibe.rent.conf declares (rent_api). Its certificate is its own name's.
# Took the name from Network's parked-domains.conf on 2026-10-15 (remove the parked blocks with it).
#
#   sudo ov-vhost-install deploy/nginx/openvibe.homes.conf openvibe.homes.conf
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.homes www.openvibe.homes;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.homes$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.homes;
    ssl_certificate     /etc/letsencrypt/live/openvibe.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.homes/privkey.pem;
    return 301 https://openvibe.homes$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.homes;
    include snippets/security-txt.conf;

    ssl_certificate     /etc/letsencrypt/live/openvibe.homes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.homes/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.homes.access.log;
    error_log  /var/log/nginx/openvibe.homes.error.log;

    # Homes has no form that posts and no upload: only GETs.
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rent's own routes are not served on this name.
    location ~* ^/(metrics|internal|api)(/|$) { return 404; }

    # The search geocodes a place (the app's per-caller budget); this is a coarse per-address ceiling in front of it.
    location = /search {
        limit_req zone=rent_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
    }

    location / {
        proxy_pass http://127.0.0.1:5010;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
