## ═══════════════════════════════════════════════════════════════
## openvibe.rent — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/openvibe.rent.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5010, systemd unit openvibe-rent) renders every page and serves
## the API; nginx terminates TLS, redirects www → apex, rate-limits sign-in and the API, and compresses text.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=rent_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rent_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=rent_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openvibe.rent www.openvibe.rent;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://openvibe.rent$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.openvibe.rent;

    ssl_certificate     /etc/letsencrypt/live/openvibe.rent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.rent/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://openvibe.rent$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name openvibe.rent;

    ssl_certificate     /etc/letsencrypt/live/openvibe.rent/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.rent/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/openvibe.rent.access.log;
    error_log  /var/log/nginx/openvibe.rent.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=rent_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
    }

    location /auth/ {
        limit_req zone=rent_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=rent_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
    }

    # ── Form writes: post, edit, renew, hide/show, delete, report, staff state ──
    # The real limits for these are the app's per-caller budgets (server/http/caller-limits.js), the same for the
    # form and the API route; this is a coarse per-address ceiling in front of them.
    location ~ "^(/post|/mine|/saved|/staff|/listings/[^/]+/(edit|renew|visibility|delete|reports|state))$" {
        limit_req zone=rent_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5010;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5010/metrics) ──
    location = /metrics { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5010;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
